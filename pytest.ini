[pytest]
# Регистрация кастомных меток
markers =
    integration: интеграционные тесты, требующие подключения к WebSocket серверу

# Подавление warnings от устаревших API websockets
# Эти warnings не критичны и не влияют на работу тестов
filterwarnings =
    ignore::DeprecationWarning:websockets.*
    ignore::DeprecationWarning:.*websockets.legacy.*
    ignore::pytest.PytestUnknownMarkWarning

# Отключение буферизации для real-time вывода логов
# -s отключает захват вывода, что позволяет видеть логи в реальном времени
addopts = -s --tb=short

